name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]' ruff build twine
      - run: ruff check . --line-length 100 --select E,W,F,I,B,C4 --ignore E501,E402,B904,B008,B007
      - run: ruff format --check . --line-length 100
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*

  notify-root:
    name: Notify root integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact merged commit
        env:
          GH_TOKEN: ${{ secrets.PROSODYAI_ROOT_DISPATCH_TOKEN }}
          LIVEKIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=Root integration notification skipped::PROSODYAI_ROOT_DISPATCH_TOKEN is not configured; the root repository will poll for $LIVEKIT_SHA"
            exit 0
          fi
          gh api --method POST repos/ProsodyAI/prosodyai/dispatches \
            -f event_type=prosodyai_livekit_main_updated \
            -f "client_payload[livekit_sha]=$LIVEKIT_SHA" \
            -f "client_payload[source_repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[source_ref]=$GITHUB_REF_NAME"
