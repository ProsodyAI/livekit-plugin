[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-prosodyai"
dynamic = ["version"]
description = "ProsodyAI plugin for LiveKit Agents: full-duplex speech with persistent speaker identity"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ProsodyAI", email = "support@prosodyai.app" }]
keywords = [
    "prosodyai",
    "prosody",
    "livekit",
    "livekit-agents",
    "speech",
    "acoustics",
    "diarization",
    "voice",
    "realtime",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "livekit>=1.1.13",
    "livekit-agents>=1.6.6",
    "websockets>=16",
]

[project.optional-dependencies]
duplex = [
    "numpy>=1.24",
    "sphn>=0.1.4",
]
dev = ["pytest", "pytest-asyncio", "numpy>=1.24"]

[project.urls]
Homepage = "https://prosodyai.app"
Documentation = "https://prosodyai.app/docs"
Repository = "https://github.com/ProsodyAI/prosodyai"
"Bug Tracker" = "https://github.com/ProsodyAI/prosodyai/issues"
LiveKit = "https://livekit.io"
"LiveKit Agents" = "https://docs.livekit.io/agents"
PyPI = "https://pypi.org/project/livekit-plugins-prosodyai/"

[tool.hatch.version]
path = "livekit/plugins/prosodyai/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit", "livekit_plugins_prosodyai"]

[tool.hatch.build.targets.sdist]
include = ["/livekit", "/livekit_plugins_prosodyai"]
